<template>
    <div class="slds-p-around_x-small slds-border_bottom slds-theme_shade">
        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
            <lightning-badge label={logsAmountBadge} class="slds-badge_inverse"></lightning-badge>
            <div if:true={hasError}>
                <span class="slds-text-color_error">{error.message}</span>
            </div>
            <lightning-button-group>
                <lightning-button
                    label={muteButtonLabel}
                    variant="border-filled"
                    onclick={handleToggleMute}
                    icon-name={muteIconName}
                    disabled={hasError}
                ></lightning-button>
                <lightning-button
                    label={labels.clearAllLbl}
                    onclick={handleClearAll}
                    icon-name="utility:delete"
                    variant="destructive"
                    disabled={disableButtons}
                ></lightning-button>
                <lightning-button
                    lwc:if={isTestButtonActive}
                    label="Test"
                    onclick={handleTest}
                    icon-name="utility:check"
                    disabled={loading}
                ></lightning-button>
                <lightning-button
                    label="Switch View Mode"
                    onclick={handleToggleMode}
                    icon-name="utility:summarydetail"
                ></lightning-button>
                <lightning-button-menu
                    alternative-text="More Actions"
                    icon-name="utility:chevrondown"
                    menu-alignment="right"
                    disabled={disableButtons}
                    onselect={handleMenuSelect}
                >
                    <lightning-menu-item
                        value="expandAll"
                        label={labels.expandAllLbl}
                        icon-name="utility:expand_all"
                    ></lightning-menu-item>
                    <lightning-menu-item
                        value="collapseAll"
                        label={labels.collapseAllLbl}
                        icon-name="utility:collapse_all"
                    ></lightning-menu-item>
                </lightning-button-menu>
            </lightning-button-group>
        </div>
    </div>
    <div class="slds-theme_default slds-p-horizontal_small slds-p-bottom_xx-small">
        <c-combobox
            label="Log Owners"
            placeholder={comboboxPlaceholder}
            options={logOwnerOptions}
            value={selectedLogOwnersAsValue}
            multi-select
            show-pills
            onchange={handleSelectLogOwner}
        ></c-combobox>
    </div>
    <div if:true={hasLogs} class="slds-container_fluid slds-scrollable_x slds-scrollable_y">
        <lightning-tree-grid
            key-field="uid"
            columns={normalizedColumns}
            data={normalizedData}
            onrowaction={handleRowAction}
            hide-checkbox-column
        >
            <c-custom-data-types-provider slot="customdatatypes"></c-custom-data-types-provider>
        </lightning-tree-grid>
    </div>
    <div if:false={hasLogs} class="slds-theme_default slds-p-around_small">
        <lightning-empty-state illustration-name="noresults:unknown" title={labels.noLogsYetLbl} size="medium">
            <p slot="description">{labels.enableLoggingLbl}</p>
        </lightning-empty-state>
    </div>
</template>
