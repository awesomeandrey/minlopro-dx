name: Playground 🐚
run-name: "Playground Workflow Run 🐚"

on:
#  pull_request:
#    types: [ opened, synchronize, reopened ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Deployment/Environment"
        required: true
        type: environment
        default: "Minlopro DevHub"

permissions:
  contents: read
  id-token: write
  issues: read
  checks: write
  pull-requests: write

jobs:
  elf-download-and-upload:
    timeout-minutes: 30
    environment: ${{ inputs.environment && inputs.environment || 'Minlopro DevHub' }}
    env:
      SF_AUTH_URL: ${{ secrets.SF_AUTH_URL }}
      SF_AUTH_URL_SCRATCH: ${{ secrets.SF_AUTH_URL_SCRATCH }}
      SF_CLI_VERSION: ${{ vars.SF_CLI_VERSION }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        event_type: [ LightningLogger, LightningPageView ]
        api_version: [ "65.0", "66.0", "67.0" ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Announce Matrix Job 📣"
        shell: bash
        run: |
          echo "::notice::Starting ELF job — event_type=${{ matrix.event_type }}, api_version=v${{ matrix.api_version }}"
          echo "::debug::Matrix combination: event_type=${{ matrix.event_type }} | api_version=${{ matrix.api_version }}"
      - name: "Build Environment 🚜"
        uses: ./.github/actions/build-env
        env:
          SF_CLI_VERSION: ${{ vars.SF_CLI_VERSION }}
      - name: "Auth Source Org (DevHub) 🎫"
        id: auth-source-org
        uses: ./.github/actions/auth-salesforce-org
        with:
          sfdx-auth-url: ${{ env.SF_AUTH_URL }}
          target-org-alias: source-devhub
      - name: "Auth Target Org (Scratch) 🎫"
        id: auth-target-org
        uses: ./.github/actions/auth-salesforce-org
        with:
          sfdx-auth-url: ${{ env.SF_AUTH_URL_SCRATCH }}
          target-org-alias: target-scratch
      - name: "Confirm Auth ✅"
        shell: bash
        run: |
          echo "::notice::Source org (DevHub) alias: ${{ steps.auth-source-org.outputs.target-org-alias }}"
          echo "::debug::Source org instance URL: ${{ steps.auth-source-org.outputs.target-org-instance-url }}"
          echo "::notice::Target org (Scratch) alias: ${{ steps.auth-target-org.outputs.target-org-alias }}"
          echo "::debug::Target org instance URL: ${{ steps.auth-target-org.outputs.target-org-instance-url }}"
      - name: "Download & Upload ELFs to CRM Analytics Dataset 📊"
        shell: bash
        run: |
          METADATA_PATH="scripts/util/event-monitoring/event-metadata-json/${{ matrix.event_type }}-v${{ matrix.api_version }}.json"
          echo "::debug::Metadata file: $METADATA_PATH"
          echo "::notice::Invoking elf.sh — mode=download-and-upload-to-dataset, folder=MinloproEventMonitoring, metadata=$METADATA_PATH"
          bash ./scripts/util/event-monitoring/elf.sh \
            --source-org-alias "${{ steps.auth-source-org.outputs.target-org-alias }}" \
            --target-org-alias "${{ steps.auth-target-org.outputs.target-org-alias }}" \
            --event-type "${{ matrix.event_type }}" \
            --api-version "${{ matrix.api_version }}" \
            --mode "download-and-upload-to-dataset" \
            --folder "MinloproEventMonitoring" \
            --metadata "$METADATA_PATH"
          echo "::notice::elf.sh completed — event_type=${{ matrix.event_type }}, api_version=v${{ matrix.api_version }}"
